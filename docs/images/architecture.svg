<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .outer { fill: none; stroke: #b9c3e6; stroke-width: 1.5; stroke-dasharray: 5,4; }
    .node { fill: #f5f7ff; stroke: #2454ff; stroke-width: 1.6; }
    .memnode { fill: #f5f7ff; stroke: #2454ff; stroke-width: 2; }
    .title { font-size: 13.5px; font-weight: 600; fill: #12234f; }
    .body { font-size: 10.5px; fill: #3a4a75; font-family: "SFMono-Regular", Consolas, monospace; }
    .dim { font-size: 10.5px; fill: #6a76a0; }
    .edge { fill: none; stroke: #2454ff; stroke-width: 1.5; marker-end: url(#arrow); }
    .dashed { fill: none; stroke: #7c88b8; stroke-width: 1.3; stroke-dasharray: 3,3; marker-end: url(#arrow); }
    .arrowhead { fill: #2454ff; }
    .label { font-size: 10.5px; fill: #12234f; }
    .heading { font-size: 18px; font-weight: 700; fill: #12234f; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .outer { stroke: #3a4470; }
      .node { fill: #1c2440; stroke: #7c9bff; }
      .memnode { fill: #1c2440; stroke: #7c9bff; }
      .title { fill: #f0f3ff; }
      .body { fill: #b7c2ea; }
      .dim { fill: #8b96c4; }
      .edge { stroke: #7c9bff; }
      .dashed { stroke: #8b96c4; }
      .arrowhead { fill: #7c9bff; }
      .label { fill: #e4e9ff; }
      .heading { fill: #f0f3ff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="460"/>

  <text x="24" y="30" class="heading">System Architecture</text>

  <!-- outer de1soc_top -->
  <rect class="outer" x="16" y="50" width="748" height="390" rx="10"/>
  <text x="390" y="68" text-anchor="middle" class="dim">de1soc_top.sv</text>

  <!-- Board I/O -->
  <rect class="node" x="32" y="88" width="130" height="180" rx="8"/>
  <text x="97" y="110" text-anchor="middle" class="title">Board I/O</text>
  <text x="97" y="130" text-anchor="middle" class="body">CLOCK_50</text>
  <text x="97" y="148" text-anchor="middle" class="body">KEY[0] rst</text>
  <text x="97" y="166" text-anchor="middle" class="body">KEY[1] start</text>
  <text x="97" y="184" text-anchor="middle" class="body">LEDR[0] done</text>
  <text x="97" y="202" text-anchor="middle" class="body">HEX3..0</text>
  <text x="97" y="222" text-anchor="middle" class="dim">"DONE" when</text>
  <text x="97" y="236" text-anchor="middle" class="dim">done = 1</text>

  <!-- gpu_top dashed box -->
  <rect class="outer" x="200" y="88" width="460" height="270" rx="8"/>
  <text x="430" y="106" text-anchor="middle" class="dim">gpu_top.sv</text>

  <!-- Dispatcher -->
  <rect class="node" x="320" y="120" width="190" height="52" rx="8"/>
  <text x="415" y="152" text-anchor="middle" class="title">Dispatcher</text>

  <!-- Cores row -->
  <rect class="node" x="215" y="220" width="100" height="46" rx="6"/>
  <text x="265" y="248" text-anchor="middle" class="title">Core 0</text>
  <rect class="node" x="325" y="220" width="100" height="46" rx="6"/>
  <text x="375" y="248" text-anchor="middle" class="title">Core 1</text>
  <rect class="node" x="435" y="220" width="100" height="46" rx="6"/>
  <text x="485" y="248" text-anchor="middle" class="title">Core 2</text>
  <rect class="node" x="545" y="220" width="100" height="46" rx="6"/>
  <text x="595" y="248" text-anchor="middle" class="title">Core 3</text>

  <!-- Dispatcher -> cores -->
  <path class="edge" d="M415,172 L265,218"/>
  <path class="edge" d="M415,172 L375,218"/>
  <path class="edge" d="M415,172 L485,218"/>
  <path class="edge" d="M415,172 L595,218"/>
  <text x="430" y="200" text-anchor="middle" class="label">valid &middot; start &middot; ready &middot; done</text>

  <!-- Arbiters -->
  <rect class="node" x="215" y="308" width="150" height="40" rx="6"/>
  <text x="290" y="332" text-anchor="middle" class="title">A Read Arbiter</text>
  <rect class="node" x="378" y="308" width="150" height="40" rx="6"/>
  <text x="453" y="332" text-anchor="middle" class="title">B Read Arbiter</text>
  <rect class="node" x="541" y="308" width="104" height="40" rx="6"/>
  <text x="593" y="332" text-anchor="middle" class="title">C Write Arbiter</text>

  <!-- Cores -> arbiters -->
  <path class="dashed" d="M265,266 L265,306"/>
  <path class="dashed" d="M375,266 L400,306"/>
  <path class="dashed" d="M485,266 L465,306"/>
  <path class="dashed" d="M595,266 L580,306"/>
  <text x="430" y="298" text-anchor="middle" class="dim">req / resp</text>

  <!-- Memory IPs -->
  <rect class="memnode" x="200" y="390" width="270" height="52" rx="8"/>
  <text x="335" y="414" text-anchor="middle" class="title">matrix_ab</text>
  <text x="335" y="432" text-anchor="middle" class="dim">Quartus BIDIR_DUAL_PORT altsyncram</text>

  <rect class="memnode" x="490" y="390" width="220" height="52" rx="8"/>
  <text x="600" y="414" text-anchor="middle" class="title">matrix_c</text>
  <text x="600" y="432" text-anchor="middle" class="dim">Quartus SINGLE_PORT altsyncram</text>

  <!-- Arbiters -> memory -->
  <path class="edge" d="M290,348 L320,388"/>
  <path class="edge" d="M453,348 L400,388"/>
  <path class="edge" d="M593,348 L600,388"/>

  <!-- Board I/O -> Dispatcher -->
  <path class="edge" d="M162,150 L318,142"/>
  <text x="240" y="134" text-anchor="middle" class="label">clk &middot; rst &middot; start &middot; done</text>
</svg>
