<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <!-- de1soc_top -->
  <rect x="1" y="1" width="718" height="398" rx="10" fill="white" stroke="#333" stroke-width="2"/>
  <text x="360" y="20" text-anchor="middle" font-size="11" fill="#999">de1soc_top.sv</text>

  <!-- Board I/O -->
  <rect x="12" y="32" width="108" height="180" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1"/>
  <text x="66" y="52" text-anchor="middle" font-weight="bold">Board I/O</text>
  <text x="66" y="72"  text-anchor="middle" fill="#555">CLOCK_50</text>
  <text x="66" y="90"  text-anchor="middle" fill="#555">KEY[0] rst</text>
  <text x="66" y="108" text-anchor="middle" fill="#555">KEY[1] start</text>
  <text x="66" y="132" text-anchor="middle" fill="#555">LEDR[0] done</text>
  <text x="66" y="150" text-anchor="middle" fill="#555">HEX3..0</text>
  <text x="66" y="168" text-anchor="middle" font-size="10" fill="#aaa">"DONE" when done=1</text>

  <!-- gpu_top -->
  <rect x="140" y="32" width="430" height="260" rx="8" fill="#fafafa" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="355" y="52" text-anchor="middle" font-size="11" fill="#777">gpu_top.sv</text>

  <!-- Dispatcher -->
  <rect x="270" y="62" width="170" height="46" rx="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="355" y="90" text-anchor="middle" font-weight="bold">Dispatcher</text>

  <!-- Cores row -->
  <rect x="150" y="160" width="90" height="40" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="195" y="185" text-anchor="middle">Core 0</text>

  <rect x="255" y="160" width="90" height="40" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="185" text-anchor="middle">Core 1</text>

  <rect x="360" y="160" width="90" height="40" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="405" y="185" text-anchor="middle">Core 2</text>

  <rect x="465" y="160" width="90" height="40" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="510" y="185" text-anchor="middle">Core 3</text>

  <!-- Dispatcher → Cores -->
  <line x1="355" y1="108" x2="195" y2="158" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="355" y1="108" x2="300" y2="158" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="355" y1="108" x2="405" y2="158" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="355" y1="108" x2="510" y2="158" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="355" y="140" text-anchor="middle" font-size="10" fill="#555">valid · start · ready · done</text>

  <!-- Arbiters row -->
  <rect x="150" y="252" width="130" height="34" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="215" y="274" text-anchor="middle">A Read Arbiter</text>

  <rect x="298" y="252" width="130" height="34" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="363" y="274" text-anchor="middle">B Read Arbiter</text>

  <rect x="446" y="252" width="118" height="34" rx="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="274" text-anchor="middle">C Write Arbiter</text>

  <!-- Cores → Arbiters (dashed) -->
  <line x1="195" y1="200" x2="195" y2="250" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="300" y1="200" x2="330" y2="250" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="405" y1="200" x2="390" y2="250" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="510" y1="200" x2="490" y2="250" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="355" y="237" text-anchor="middle" font-size="10" fill="#888">req / resp</text>

  <!-- Memory IPs -->
  <rect x="140" y="310" width="250" height="46" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="265" y="331" text-anchor="middle" font-weight="bold">matrix_ab</text>
  <text x="265" y="348" text-anchor="middle" font-size="10" fill="#777">Quartus BIDIR_DUAL_PORT altsyncram</text>

  <rect x="410" y="310" width="200" height="46" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="510" y="331" text-anchor="middle" font-weight="bold">matrix_c</text>
  <text x="510" y="348" text-anchor="middle" font-size="10" fill="#777">Quartus SINGLE_PORT altsyncram</text>

  <!-- Arbiters → Memory -->
  <line x1="215" y1="286" x2="230" y2="308" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="363" y1="286" x2="310" y2="308" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="505" y1="286" x2="510" y2="308" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- Board I/O → Dispatcher arrow -->
  <line x1="120" y1="90" x2="268" y2="85" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="194" y="80" text-anchor="middle" font-size="10" fill="#555">clk · rst · start · done</text>
</svg>
