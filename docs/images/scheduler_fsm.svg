<svg viewBox="0 0 660 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Left column states -->
  <!-- IDLE -->
  <rect x="80" y="20" width="130" height="44" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="145" y="47" text-anchor="middle" font-weight="bold">IDLE</text>

  <!-- INIT -->
  <rect x="80" y="118" width="130" height="44" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="145" y="145" text-anchor="middle" font-weight="bold">INIT</text>

  <!-- WAIT_AB -->
  <rect x="80" y="228" width="130" height="48" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="145" y="252" text-anchor="middle" font-weight="bold">WAIT_AB</text>
  <text x="145" y="268" text-anchor="middle" font-size="10" fill="#666">issue A/B reads</text>

  <!-- WRITE_REQ -->
  <rect x="80" y="368" width="130" height="48" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="145" y="392" text-anchor="middle" font-weight="bold">WRITE_REQ</text>
  <text x="145" y="408" text-anchor="middle" font-size="10" fill="#666">issue C write</text>

  <!-- DONE_ST (double border) -->
  <rect x="76" y="476" width="138" height="40" rx="6" fill="white" stroke="#333" stroke-width="1"/>
  <rect x="80" y="480" width="130" height="32" rx="4" fill="white" stroke="#333" stroke-width="2"/>
  <text x="145" y="501" text-anchor="middle" font-weight="bold">DONE_ST</text>

  <!-- Right column states -->
  <!-- NEXT_K -->
  <rect x="440" y="148" width="120" height="44" rx="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="175" text-anchor="middle" font-weight="bold">NEXT_K</text>

  <!-- NEXT_T -->
  <rect x="440" y="228" width="120" height="44" rx="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="255" text-anchor="middle" font-weight="bold">NEXT_T</text>

  <!-- NEXT_W -->
  <rect x="440" y="368" width="120" height="44" rx="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="395" text-anchor="middle" font-weight="bold">NEXT_W</text>

  <!-- ── Arrows ── -->

  <!-- rst → IDLE -->
  <line x1="145" y1="8" x2="145" y2="18" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="14" font-size="10" fill="#888">rst</text>

  <!-- IDLE → INIT -->
  <line x1="145" y1="64" x2="145" y2="116" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="152" y="95" font-size="11">start</text>

  <!-- INIT → WAIT_AB -->
  <line x1="145" y1="162" x2="145" y2="226" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="152" y="200" font-size="11">k=t=0</text>

  <!-- WAIT_AB stall (self-loop left) -->
  <path d="M80,240 Q40,240 40,252 Q40,264 80,264" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="36" y="246" text-anchor="end" font-size="10">stall</text>

  <!-- WAIT_AB → NEXT_T -->
  <line x1="210" y1="252" x2="438" y2="252" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="324" y="244" text-anchor="middle" font-size="10">a_have &amp;&amp; b_have</text>

  <!-- NEXT_T → NEXT_K (t==last) -->
  <line x1="500" y1="228" x2="500" y2="194" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="510" y="215" font-size="10">t==last</text>

  <!-- NEXT_T → WAIT_AB (t&lt;last, below) -->
  <path d="M500,272 Q500,315 324,315 Q210,315 210,276" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="328" text-anchor="middle" font-size="10">t &lt; last  (t++)</text>

  <!-- NEXT_K → WAIT_AB (k&lt;N-1) -->
  <path d="M440,170 Q310,170 210,248" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="320" y="162" text-anchor="middle" font-size="10">k &lt; N-1  (k++, t=0)</text>

  <!-- NEXT_K → WRITE_REQ (k==N-1, right bypass) -->
  <path d="M560,170 L590,170 L590,392 L212,392" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="295" font-size="10">k==N-1</text>

  <!-- WRITE_REQ stall -->
  <path d="M80,380 Q40,380 40,392 Q40,404 80,404" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="36" y="386" text-anchor="end" font-size="10">stall</text>

  <!-- WRITE_REQ → NEXT_W -->
  <line x1="210" y1="392" x2="438" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="324" y="383" text-anchor="middle" font-size="10">c_req_ready</text>

  <!-- NEXT_W → WRITE_REQ (t&lt;last) -->
  <path d="M500,368 Q500,346 324,346 Q210,346 210,368" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="340" text-anchor="middle" font-size="10">t &lt; last  (t++)</text>

  <!-- NEXT_W → DONE_ST -->
  <path d="M500,412 Q500,496 212,496" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="510" y="460" font-size="10">t==last</text>

  <!-- DONE_ST → INIT (left arc) -->
  <path d="M80,496 Q28,496 28,140 Q28,118 78,136" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="22" y="320" font-size="10" transform="rotate(-90 18 320)">start</text>
</svg>
