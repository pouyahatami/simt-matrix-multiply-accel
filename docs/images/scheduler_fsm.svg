<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f5f7ff; stroke: #2454ff; stroke-width: 2; }
    .title { font-size: 14px; font-weight: 600; fill: #12234f; }
    .body { font-size: 11px; fill: #3a4a75; font-family: "SFMono-Regular", Consolas, monospace; }
    .edge { fill: none; stroke: #2454ff; stroke-width: 1.6; marker-end: url(#arrow); }
    .arrowhead { fill: #2454ff; }
    .label { font-size: 11px; fill: #12234f; }
    .heading { font-size: 18px; font-weight: 700; fill: #12234f; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .node { fill: #1c2440; stroke: #7c9bff; }
      .title { fill: #f0f3ff; }
      .body { fill: #b7c2ea; }
      .edge { stroke: #7c9bff; }
      .arrowhead { fill: #7c9bff; }
      .label { fill: #e4e9ff; }
      .heading { fill: #f0f3ff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="700" height="560"/>

  <text x="24" y="30" class="heading">Per-Core Scheduler FSM</text>

  <!-- IDLE -->
  <rect class="node" x="70" y="55" width="150" height="50" rx="8"/>
  <text x="145" y="86" text-anchor="middle" class="title">IDLE</text>

  <!-- INIT -->
  <rect class="node" x="70" y="155" width="150" height="50" rx="8"/>
  <text x="145" y="186" text-anchor="middle" class="title">INIT</text>

  <!-- WAIT_AB -->
  <rect class="node" x="70" y="265" width="150" height="56" rx="8"/>
  <text x="145" y="290" text-anchor="middle" class="title">WAIT_AB</text>
  <text x="145" y="307" text-anchor="middle" class="body">issue A/B reads</text>

  <!-- WRITE_REQ -->
  <rect class="node" x="70" y="405" width="150" height="56" rx="8"/>
  <text x="145" y="430" text-anchor="middle" class="title">WRITE_REQ</text>
  <text x="145" y="447" text-anchor="middle" class="body">issue C write</text>

  <!-- DONE_ST -->
  <rect class="node" x="70" y="515" width="150" height="42" rx="8"/>
  <text x="145" y="541" text-anchor="middle" class="title">DONE_ST</text>

  <!-- NEXT_K -->
  <rect class="node" x="470" y="185" width="140" height="50" rx="8"/>
  <text x="540" y="216" text-anchor="middle" class="title">NEXT_K</text>

  <!-- NEXT_T -->
  <rect class="node" x="470" y="265" width="140" height="50" rx="8"/>
  <text x="540" y="296" text-anchor="middle" class="title">NEXT_T</text>

  <!-- NEXT_W -->
  <rect class="node" x="470" y="405" width="140" height="50" rx="8"/>
  <text x="540" y="436" text-anchor="middle" class="title">NEXT_W</text>

  <!-- rst -> IDLE -->
  <path class="edge" d="M145,30 L145,55"/>
  <text x="155" y="46" class="label">rst</text>

  <!-- IDLE -> INIT -->
  <path class="edge" d="M145,105 L145,155"/>
  <text x="156" y="134" class="label">start</text>

  <!-- INIT -> WAIT_AB -->
  <path class="edge" d="M145,205 L145,265"/>
  <text x="156" y="240" class="label">k = t = 0</text>

  <!-- WAIT_AB self loop -->
  <path class="edge" d="M70,278 C25,278 25,298 68,296"/>
  <text x="18" y="272" class="label">stall</text>

  <!-- WAIT_AB -> NEXT_T -->
  <path class="edge" d="M220,290 L468,290"/>
  <text x="344" y="282" text-anchor="middle" class="label">a_have &amp;&amp; b_have</text>

  <!-- NEXT_T -> NEXT_K -->
  <path class="edge" d="M540,265 L540,235"/>
  <text x="552" y="253" class="label">t == last</text>

  <!-- NEXT_T -> WAIT_AB -->
  <path class="edge" d="M540,315 C540,355 344,355 220,313"/>
  <text x="380" y="368" text-anchor="middle" class="label">t &lt; last (t++)</text>

  <!-- NEXT_K -> WAIT_AB -->
  <path class="edge" d="M470,205 C360,205 260,255 222,278"/>
  <text x="340" y="196" text-anchor="middle" class="label">k &lt; N-1 (k++, t=0)</text>

  <!-- NEXT_K -> WRITE_REQ -->
  <path class="edge" d="M610,210 C650,210 650,432 222,432"/>
  <text x="660" y="330" text-anchor="middle" class="label">k == N-1</text>

  <!-- WRITE_REQ self loop -->
  <path class="edge" d="M70,418 C25,418 25,438 68,436"/>
  <text x="18" y="412" class="label">stall</text>

  <!-- WRITE_REQ -> NEXT_W -->
  <path class="edge" d="M220,432 L468,432"/>
  <text x="344" y="424" text-anchor="middle" class="label">c_req_ready</text>

  <!-- NEXT_W -> WRITE_REQ -->
  <path class="edge" d="M470,412 C400,390 260,390 220,412"/>
  <text x="380" y="384" text-anchor="middle" class="label">t &lt; last (t++)</text>

  <!-- NEXT_W -> DONE_ST -->
  <path class="edge" d="M540,455 C540,536 222,536 222,536"/>
  <text x="552" y="498" class="label">t == last</text>

  <!-- DONE_ST -> INIT (loop back) -->
  <path class="edge" d="M70,536 C10,536 10,180 68,180"/>
  <text x="16" y="360" class="label" transform="rotate(-90 16 360)">start</text>
</svg>
